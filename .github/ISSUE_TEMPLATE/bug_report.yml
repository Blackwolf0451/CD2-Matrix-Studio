name: Bug report
description: Report a problem with CD2 Matrix Studio
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: CD2 Matrix Studio version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Dock model / revision
      placeholder: "Flydigi Charging Dock 2 Pro"
    validations:
      required: true

  - type: dropdown
    id: space_station
    attributes:
      label: Was Flydigi Space Station fully closed?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs / additional information
