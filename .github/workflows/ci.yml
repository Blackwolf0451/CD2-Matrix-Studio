name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest 'Pillow>=10.0,<13'

      - name: Check synchronized release version
        run: python tools/check_release.py

      - name: Run core tests
        env:
          PYTHONPATH: src
        run: pytest -q
