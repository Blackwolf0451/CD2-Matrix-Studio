[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cd2-matrix-studio"
version = "1.0.0"
description = "Unofficial LED matrix editor for the Flydigi Charging Dock 2 Pro"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.7,<7",
    "hidapi>=0.14,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
